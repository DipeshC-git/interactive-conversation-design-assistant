##############################################################################
# watsonx Orchestrate — Agent Definition
# Agent: MS Learn Conversation Assistant
#
# Architecture (3-agent roles mapped to Orchestrate native constructs):
#
#   ┌──────────────────────────────────────────────────────────────────────┐
#   │  Role 1 — Context Aware Agent (Supervisor)                           │
#   │  → This Orchestrate Agent.                                           │
#   │  → Maintains session context, routes intent, manages conversation.  │
#   │  → Decides when to invoke the Retrieval Tool.                        │
#   ├──────────────────────────────────────────────────────────────────────┤
#   │  Role 2 — Information Retrieval Agent                                │
#   │  → microsoft_learn_search MCP Tool (Streamable HTTP).               │
#   │  → Registered as an Orchestrate Tool. Agent invokes autonomously.   │
#   │  → Endpoint: https://learn.microsoft.com/api/mcp                    │
#   ├──────────────────────────────────────────────────────────────────────┤
#   │  Role 3 — Content Representation Agent                               │
#   │  → System Instructions applied to this agent's LLM.                 │
#   │  → DITA-typed output: TASK / CONCEPT / REFERENCE.                   │
#   │  → Every response ends with exactly one [See more: Title](url) link.│
#   │  → No option menus. No navigation blocks. No "What's next?" prompts.│
#   └──────────────────────────────────────────────────────────────────────┘
#
# How to deploy:
#   1. In Orchestrate Agent Builder, create a new Agent.
#   2. Paste the content of system_instructions.md into the Instructions field.
#   3. Register the MCP tool (mslearn_mcp_tool.json → Tools > Add Tool > MCP).
#   4. Bind it to this agent under Tools > microsoft_learn_search.
#   5. Copy the llm / session / deduplication blocks below into agent settings.
#   6. Save and publish.
##############################################################################

agent:
  # ── Identity ───────────────────────────────────────────────────────────────
  name: ms_learn_conversation_assistant
  display_name: "MS Learn Conversation Assistant"
  description: >
    A conversational technical assistant that answers questions about Microsoft
    technologies by retrieving live documentation from Microsoft Learn.
    Responds as a Senior Technical Writer using structured DITA-style output.
    Every response ends with a single source link — no option menus or navigation
    blocks are generated by the agent.

  # ── LLM Configuration ──────────────────────────────────────────────────────
  # Uses the LLM already provisioned in your Orchestrate instance.
  # No external watsonx.ai API key required.
  llm:
    provider: watsonx_orchestrate   # resolved to your instance's default model
    temperature: 0.1                 # low temperature → factual, deterministic output
    max_tokens: 1800                 # sufficient for 600-word prose + code blocks

  # ── Tools ──────────────────────────────────────────────────────────────────
  # Role 2 (Information Retrieval Agent) is fulfilled by this MCP tool.
  tools:
    - name: microsoft_learn_search
      description: >
        Retrieves official Microsoft Learn documentation. Call this tool for
        every user question that requires factual technical information about
        any Microsoft product, service, API, or SDK.
      auto_invoke: true              # agent decides autonomously when to call
      max_calls_per_turn: 2          # allow one refinement retry per turn

  # ── Session Context ────────────────────────────────────────────────────────
  # Role 1 (Context Aware Agent / Supervisor) state is held here.
  session:
    persist_context: true
    context_keys:
      - mcp_session_id              # MS Learn MCP session — reused across turns
      - iteration_count             # tracks how many exchanges have occurred
      - prior_queries               # deduplication: queries already sent this session
      - prior_source_urls           # deduplication: URLs already surfaced this session

  # ── Deduplication Rules ────────────────────────────────────────────────────
  # Applied before results are passed to the LLM for rendering.
  deduplication:
    sources:
      strategy: normalise_url
      # Normalisation steps (applied in order):
      #   1. Lowercase scheme and host
      #   2. Strip trailing slash
      #   3. Remove query parameters: wt.mc_id, WT.mc_id, ocid, WT.srch, utm_*
      scope: session                # dedup across all turns in the same sessionId
      on_duplicate: suppress        # silently drop — never inform the user

  # ── Output Rendering Rules ─────────────────────────────────────────────────
  # Role 3 (Content Representation Agent) rendering contract:
  #   - Every response ends with exactly one [See more: Article Title](url) line.
  #   - No sources list. No option menu. No navigation block.
  #   - The single source link is the only external URL in the response.
  output:
    sources_visible: false          # no rendered source section or URL list
    closing_line:
      format: "[See more: {article_title}]({canonical_url})"
      position: last_line           # always the very last line of the response
      separator: ""                 # no horizontal rule before the closing line
      max_per_turn: 1               # exactly one closing line per turn
      selection_strategy: most_relevant
      # If no valid URL was retrieved, omit this line entirely.
      # Never fabricate a URL.
      omit_when: no_valid_url_retrieved

  # ── Confidence Routing ─────────────────────────────────────────────────────
  routing:
    low_confidence_threshold: 0.45
    on_low_confidence:
      # Surface 2–3 refined search query suggestions inline; do not add option buttons.
      action: surface_refinements_inline

  # ── Accessibility ──────────────────────────────────────────────────────────
  accessibility:
    enforce_alt_text: true
    enforce_table_headers: true
    disallow_bare_urls: true        # all URLs must be hyperlinked with descriptive text
    disallow_directional_language: true

  # ── System Instructions Reference ─────────────────────────────────────────
  # Role 3 (Content Representation Agent) is fully defined in system_instructions.md.
  # Paste the full content of that file into the Agent Builder Instructions field.
  # The instructions define: DITA response types, formatting rules, accessibility
  # mandates, confidence handling, and the mandatory [See more: ...] closing line.
  instructions_source: >
    File: conversation_agent/orchestrate/system_instructions.md
    Paste everything between the BEGIN / END delimiters into the Instructions field.
