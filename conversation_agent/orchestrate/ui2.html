<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversation Design Assistant</title>

<style>
html, body {
  margin: 0; padding: 0;
  width: 100vw; height: 100vh;
  overflow: hidden;
  background: #f4f7fb;
  font-family: system-ui, sans-serif;
}

#app-header {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 48px;
  background: #161616; color: #fff;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
}

#chat-root {
  position: absolute;
  top: 48px;
  width: 100%; height: calc(100% - 48px);
}

/* Cards */
.batch-wrapper { margin: 10px 0; max-width: 600px; }
.card-row { display: flex; gap: 10px; overflow-x: auto; }

.card {
  min-width: 220px;
  background: #fff;
  border: 1px solid #ddd;
  border-left: 3px solid #0f62fe;
  border-radius: 6px;
  padding: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.card:hover { background: #edf5ff; }

.card.active {
  border-color: #0f62fe;
  background: #dfeaff;
}

.card.loading {
  opacity: 0.6;
  pointer-events: none;
}

.card-title { font-size: 13px; font-weight: 600; }
.card-desc { font-size: 11px; color: #555; margin-top: 4px; }

.nav {
  display: flex; justify-content: space-between; margin-top: 6px;
}

.nav button {
  padding: 4px 10px;
  border: 1px solid #0f62fe;
  background: white;
  color: #0f62fe;
  cursor: pointer;
}
</style>
</head>

<body>

<header id="app-header">
  <div>Conversation Design Assistant</div>
  <button onclick="location.reload()">Reset</button>
</header>

<div id="chat-root"></div>

<script>
let chatInstance;
let isSending = false;

/* =========================
   SEND (NUMBER + TEXT)
========================= */
function sendPrompt(card, el) {
  if (!chatInstance || isSending) return;

  isSending = true;

  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  el.classList.add('active', 'loading');

  let payload = card.num + ". " + card.title;

  chatInstance.send({ input: { text: payload } });

  setTimeout(() => { isSending = false; }, 1500);
}

/* =========================
   HANDLE CHAT LOAD
========================= */
function handleChat(instance) {
  chatInstance = instance;
  instance.open();

  instance.on({
    type: 'pre:receive',
    handler: function(event) {

      let generic = event?.data?.output?.generic;
      if (!Array.isArray(generic)) return;

      let newGen = [];

      generic.forEach(item => {

        if (item.response_type !== 'text') {
          newGen.push(item);
          return;
        }

        let raw = item.text.trim();

        /* ARTICLE */
        if (/^ARTICLE:/i.test(raw)) {
          newGen.push({
            response_type: 'text',
            text: raw.replace(/^ARTICLE:/i, '').trim()
          });
          return;
        }

        /* PARSE TOPICS */
        let lines = raw.replace(/^TOPICS:/i, '').split('\n');

        let cards = [];
        let current = null;

        lines.forEach(line => {
          let t = line.trim();
          if (!t) return;

          let m = t.match(/^(\d+)[\.\)]\s+(.*)/);

          if (m) {
            if (current) cards.push(current);

            current = {
              num: m[1],
              title: m[2].replace(/[*_]/g, '').trim(),
              desc: ''
            };

          } else if (current && !current.desc && !/^#+/.test(t)) {
            current.desc = t;
          }
        });

        if (current) cards.push(current);

        if (cards.length) {
          newGen.push({
            response_type: 'user_defined',
            user_defined: { cards: cards }
          });
        } else {
          newGen.push(item);
        }
      });

      event.data.output.generic = newGen;
    }
  });

  instance.on({
    type: 'customResponse',
    handler: function(event, data) {

      if (data.message.response_type !== 'user_defined') return;

      let cards = data.message.user_defined.cards;

      let container = event.data.element;
      let wrapper = document.createElement('div');
      wrapper.className = 'batch-wrapper';

      let row = document.createElement('div');
      row.className = 'card-row';

      let index = 0;
      let batchSize = 3;

      function renderBatch() {
        row.innerHTML = '';

        cards.slice(index, index + batchSize).forEach(card => {

          let el = document.createElement('div');
          el.className = 'card';

          el.onclick = () => sendPrompt(card, el);

          let t = document.createElement('div');
          t.className = 'card-title';
          t.innerText = card.num + ". " + card.title;

          el.appendChild(t);

          if (card.desc) {
            let d = document.createElement('div');
            d.className = 'card-desc';
            d.innerText = card.desc;
            el.appendChild(d);
          }

          row.appendChild(el);
        });
      }

      renderBatch();

      let nav = document.createElement('div');
      nav.className = 'nav';

      let prev = document.createElement('button');
      prev.innerText = "Back";
      prev.onclick = () => {
        if (index >= batchSize) {
          index -= batchSize;
          renderBatch();
        }
      };

      let next = document.createElement('button');
      next.innerText = "Next";
      next.onclick = () => {
        if (index + batchSize < cards.length) {
          index += batchSize;
          renderBatch();
        }
      };

      nav.appendChild(prev);
      nav.appendChild(next);

      wrapper.appendChild(row);
      wrapper.appendChild(nav);

      container.appendChild(wrapper);

      setTimeout(() => container.scrollIntoView({ behavior: 'smooth' }), 100);
    }
  });
}

/* =========================
   BOOT
========================= */
fetch('/config')
.then(r => r.json())
.then(cfg => {

  window.wxOConfiguration = {
    orchestrationID : cfg.orchestration_id,
    hostURL         : cfg.host_url,
    rootElementID   : 'chat-root',
    showLauncher    : false,
    chatOptions: {
      agentId            : cfg.agent_id,
      agentEnvironmentId : cfg.agent_env_id
    },
    layout: { form: 'fullPage' }
  };

  let obs = new MutationObserver(() => {
    let inst = window.wxoChat || window.WXOChat;
    if (inst?.on) {
      obs.disconnect();
      handleChat(inst);
    }
  });

  obs.observe(document.getElementById('chat-root'), { childList: true, subtree: true });

  let s = document.createElement('script');
  s.src = cfg.host_url + '/wxochat/wxoLoader.js?embed=true';
  s.onload = () => wxoLoader.init();
  document.head.appendChild(s);

});
</script>

</body>
</html>
