<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intently</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    overflow: hidden;
    background-color: #f4f7fb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  #app-header {
    position: absolute; top: 0; left: 0;
    width: 100vw; height: 48px;
    background-color: #161616; color: #ffffff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; box-sizing: border-box; z-index: 999999;
  }
  #app-header h1 { font-size: 15px; font-weight: 500; margin: 0; color: #f4f4f4; }
  .reset-btn {
    background-color: #393939; color: #ffffff;
    border: 1px solid #525252; border-radius: 4px;
    padding: 6px 14px; font-size: 12px; font-weight: 500;
    cursor: pointer;
  }
  .reset-btn:hover { background-color: #4c4c4c; border-color: #0f62fe; }

  #chat-root {
    width: 100vw; height: calc(100vh - 48px);
    position: absolute; top: 48px; left: 0;
  }
  #chat-root iframe,
  .WXO-chat-container,
  #WACContainer,
  #WACContainer .WACWidget--defaultElement {
    width: 100% !important; height: 100% !important;
    max-width: 100% !important; max-height: 100% !important;
    position: absolute !important; top: 0 !important; left: 0 !important;
    border: none !important; box-shadow: none !important;
  }
</style>
</head>
<body>

<header id="app-header">
  <h1>Intently</h1>
  <button class="reset-btn" onclick="resetChatSession()">Reset Chat</button>
</header>

<div id="chat-root"></div>

<script>
'use strict';

var chatInstance = null;
var _batchNumber = 0;

/* ─────────────────────────────────────────────────────────────────
   TOPICS parser
   Handles both single-line and multi-line item formats:
     "1. Title - Source"          (inline)
     "1. Title\n   - Source"      (source on next line, indented)
     "1. Title\nDescription text" (description on next line)
   Converts into Watson Assistant `option` response_type (clickable tiles)
   + More / Back nav buttons.
───────────────────────────────────────────────────────────────── */
function _parseTopicsBlock(text) {
  if (!/^\s*\d+\.\s+/m.test(text)) return null;

  /* Extract intro: the line(s) between "TOPICS:" and the first numbered item.
     Handle both "TOPICS: inline text" and "TOPICS:\nNext line text" */
  var introRaw = text.replace(/^TOPICS:\s*/i, '').replace(/\s*\n?\s*\d+\.[\s\S]*$/i, '').trim();
  /* introRaw may span multiple lines — collapse to single line */
  var intro = introRaw.replace(/\n+/g, ' ').trim();

  /* Split text into per-item blocks by splitting on numbered list markers.
     Each block starts at "N." and runs until the next "N." or end of string. */
  var tiles = [];
  /* Match each numbered item block: digit, dot, whitespace, then everything
     until the next numbered item or end — including newlines. */
  var blockRe = /^\s*(\d+)\.\s+([\s\S]*?)(?=\n\s*\d+\.\s+|\n*$)/mg;
  var m;
  while ((m = blockRe.exec(text)) !== null) {
    var num   = m[1];
    var block = m[2].trim();                     /* full block, may be multi-line */
    var lines = block.split('\n');
    var titleLine = lines[0].trim();

    /* Inline " - Source" separator on the title line */
    var di = titleLine.indexOf(' - ');
    var title   = di !== -1 ? titleLine.slice(0, di).trim() : titleLine;
    /* Source/context: remainder of title line after " - ", or next non-empty line */
    var context = '';
    if (di !== -1) {
      context = titleLine.slice(di + 3).trim();
    } else if (lines.length > 1) {
      /* Next line may be "  - Source" (indented dash) or plain description */
      var nextLine = lines[1].trim().replace(/^-\s*/, '').trim();
      if (nextLine) context = nextLine;
    }

    tiles.push({ num: num, title: title, context: context });
  }
  if (!tiles.length) return null;

  /* More / Back buttons:
     - "More topics" always shown unless agent signals last batch explicitly.
     - "Back" shown from batch 2 onward (_batchNumber > 0 after first response).
     The footer line is swallowed by the block regex so we cannot detect "more"
     from remaining text — default to always showing it instead. */
  var isLastBatch = /no more topics|no more results|that('s| is) all|last batch/i.test(text);
  var hasMore  = !isLastBatch;
  var hasBack  = _batchNumber > 0;
  _batchNumber++;

  /* Build Watson Assistant options array */
  var options = tiles.map(function(t) {
    /* Show context as subtitle in the label if present */
    var label = t.num + '. ' + t.title;
    if (t.context) label += '  —  ' + t.context;
    return {
      label: label,
      value: { input: { text: t.num } }
    };
  });
  if (hasMore) options.push({ label: '▶  More topics', value: { input: { text: 'more' } } });
  if (hasBack) options.push({ label: '◀  Back',        value: { input: { text: 'back' } } });

  return { intro: intro, options: options };
}

function resetChatSession() {
  _batchNumber = 0;
  if (chatInstance && typeof chatInstance.restartConversation === 'function') {
    chatInstance.restartConversation();
  } else if (chatInstance && typeof chatInstance.restart === 'function') {
    chatInstance.restart();
  } else {
    window.location.reload();
  }
}

/* ── Boot: pre-fetch token + config, then load wxoLoader ── */
var _cachedToken = null;

function _refreshToken() {
  return fetch('/api/token')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.error) throw new Error(d.error);
      _cachedToken = d.token;
      return d.token;
    });
}

Promise.all([_refreshToken(), fetch('/config').then(function(r){ return r.json(); })])
  .then(function(results) {
    var cfg = results[1];
    if (cfg.error) throw new Error(cfg.error);

    window.wxOConfiguration = {
      orchestrationID    : cfg.orchestration_id,
      hostURL            : cfg.host_url,
      rootElementID      : 'chat-root',
      deploymentPlatform : 'ibmcloud',
      crn                : cfg.crn,
      showLauncher       : false,
      chatOptions: {
        agentId            : cfg.agent_id,
        agentEnvironmentId : cfg.agent_env_id
      },
      layout: { form: 'fullPage' },

      /* authTokenNeeded fires BEFORE onLoad — must be registered here in the
         config object so the SDK has it from the very first API call.
         _cachedToken is already set by _refreshToken() called above. */
      onAuthTokenNeeded: function() {
        /* Kick off a background refresh so the cache stays warm */
        _refreshToken();
        return _cachedToken || '';
      },

      onLoad: function(instance) {
        chatInstance = instance;
        if (instance.open) instance.open();

        /* ── pre:receive — transform TOPICS text into clickable option tiles ── */
        instance.on({
          type: 'pre:receive',
          handler: function(event) {
            var generic = event.data && event.data.output && event.data.output.generic;
            if (!generic || !Array.isArray(generic)) return;

            var toInsert = [];
            var toRemove = [];

            generic.forEach(function(item, idx) {
              if (item.response_type !== 'text' || !item.text) return;
              var raw = item.text;

              /* TOPICS block → option tiles */
              if (/^TOPICS:/i.test(raw.trim()) || /^\s*1\.\s+/m.test(raw)) {
                var parsed = _parseTopicsBlock(raw);
                if (parsed) {
                  toRemove.push(idx);
                  if (parsed.intro) {
                    toInsert.push({ idx: idx, item: { response_type: 'text', text: parsed.intro } });
                  }
                  toInsert.push({
                    idx: idx + 1,
                    item: {
                      /* Watson Assistant Web Chat / WXO SDK option format.
                         response_type:'option' renders buttons natively.
                         Each option value.input.text is sent as the user's
                         next message when the button is clicked — this
                         naturally triggers the Layer-2 ARTICLE: response
                         for digit selections, and "more"/"back" for nav. */
                      response_type : 'option',
                      title         : 'Choose a topic:',
                      options       : parsed.options
                    }
                  });
                  return;
                }
              }

              /* ARTICLE sentinel — strip the prefix line before rendering */
              item.text = raw.replace(/^ARTICLE:\s*\n?/i, '').trim();
            });

            /* Apply removals (reverse order) then insertions */
            toRemove.slice().reverse().forEach(function(i) { generic.splice(i, 1); });
            toInsert.sort(function(a, b) { return a.idx - b.idx; });
            var offset = 0;
            toInsert.forEach(function(entry) {
              generic.splice(entry.idx - toRemove.length + offset, 0, entry.item);
              offset++;
            });
          }
        });

        /* ── pre:send — when the user clicks an option tile the SDK sends
           value.input.text automatically. We intercept here only to strip
           any accidental whitespace so "1 " doesn't confuse the agent. ── */
        instance.on({
          type: 'pre:send',
          handler: function(event) {
            if (event.data && event.data.input && typeof event.data.input.text === 'string') {
              event.data.input.text = event.data.input.text.trim();
            }
          }
        });
      }     /* end onLoad */
    };      /* end wxOConfiguration */

    setTimeout(function() {
      var s = document.createElement('script');
      s.src = cfg.host_url + '/wxochat/wxoLoader.js?embed=true';
      s.addEventListener('load', function() { wxoLoader.init(); });
      document.head.appendChild(s);
    }, 0);
  })        /* end Promise.all .then */
  .catch(function(err) {
    console.error('[App] boot failed:', err);
    var root = document.getElementById('chat-root');
    if (root) {
      root.style.cssText = 'display:flex;align-items:center;justify-content:center;';
      root.innerHTML = '<p style="color:#da1e28;font-size:14px;font-family:inherit">'
        + 'Could not load: ' + (err.message || err) + '</p>';
    }
  });
</script>
</body>
</html>
