[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intently"
version = "1.0.0"
description = "AI-powered multi-agent documentation retrieval and intelligent workflow orchestration system."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Async HTTP client for MCP and watsonx API calls
    "httpx>=0.27.0",

    # Data validation and schema enforcement
    "pydantic>=2.7.0",

    # Web framework — REST API
    "fastapi>=0.111.0",

    # ASGI server
    "uvicorn[standard]>=0.29.0",

    # Conversation agent core deps
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
# Install with: pip install -e ".[full]"
full = [
    "ibm-watsonx-ai>=1.1.0",
    "faiss-cpu>=1.8.0",
]

# Install with: pip install -e ".[dev]"
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test_outputs"]

[tool.setuptools.packages.find]
where = ["."]
include = ["conversation_agent*"]
